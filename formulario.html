<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Josimar dos Santos Paula">
    <meta name="description"
        content="Formulário de revisão de produto para registrar classificação, data de instalação, recursos úteis, comentários e informações do usuário.">
    <title>Revisão de Produto</title>
    <link rel="stylesheet" href="estilos/formulario.css">
    <link rel="stylesheet" href="estilos/formulario-grande.css">
    <script src="scripts/produtos.js" defer></script>
    <script src="scripts/formulario.js" defer></script>
</head>

<body>
    <header>
        <h1>Revisão de Produto</h1>
    </header>
    <main>
        <form action="avaliacao.html" method="get">
            <div class="campo">
                <label for="produto">Nome do Produto</label>
                <select id="produto" name="produto" required>
                    <option value="" disabled selected>Selecione um produto ...</option>
                </select>
            </div>
            <fieldset class="campo">
                <legend>Classificação Geral *</legend>
                <label for="classificacao-1">
                    <input type="radio" id="classificacao-1" name="classificacao" value="1" required>
                    1 ★
                </label>
                <label for="classificacao-2">
                    <input type="radio" id="classificacao-2" name="classificacao" value="2" required>
                    2 ★
                </label>
                <label for="classificacao-3">
                    <input type="radio" id="classificacao-3" name="classificacao" value="3" required>
                    3 ★
                </label>
                <label for="classificacao-4">
                    <input type="radio" id="classificacao-4" name="classificacao" value="4" required>
                    4 ★
                </label>
                <label for="classificacao-5">
                    <input type="radio" id="classificacao-5" name="classificacao" value="5" required>
                    5 ★
                </label>
            </fieldset>
            <div class="campo">
                <label for="data-instalacao">Data de Instalação *</label>
                <input type="date" id="data-instalacao" name="data-instalacao" required>
            </div>
            <fieldset class="campo">
                <legend>Recursos Úteis <span>(Marque todos que se aplicam)</span></legend>
                <label for="durabilidade">
                    <input type="checkbox" id="durabilidade" name="recursos" value="Durabilidade">
                    Durabilidade
                </label>
                <label for="facilidade">
                    <input type="checkbox" id="facilidade" name="recursos" value="Facilidade de Uso">
                    Facilidade de Uso
                </label>
                <label for="desempenho">
                    <input type="checkbox" id="desempenho" name="recursos" value="Desempenho">
                    Desempenho
                </label>
                <label for="design">
                    <input type="checkbox" id="design" name="recursos" value="Design">
                    Design
                </label>
            </fieldset>
            <div class="campo">
                <label for="avaliacao">Avaliação Escrita <span>(Opcional)</span></label>
                <textarea id="avaliacao" name="avaliacao" rows="5"></textarea>
            </div>
            <div class="campo">
                <label for="nome-usuario">Nome de Usuário <span>(Opcional)</span></label>
                <input type="text" id="nome-usuario" name="nome-usuario">
            </div>
            <div class="campo">
                <input type="submit" value="Publicar Avaliação">
            </div>
        </form>
    </main>
    <footer>
        <p>&copy; <span id="ano"></span> | Josimar dos Santos Paula | Brasil</p>
        <p>Última Modificação: <span id="modificado"></span></p>
    </footer>
</body>

</html>
